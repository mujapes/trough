name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # x86 runner: Google's aapt2 reads the API 35 resource table (Debian's arm64 aapt2 cannot).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Scenario protocol oracle
        run: tests/scenarios.sh
      - name: Build
        # ANDROID_HOME is set in the runner's shell, not the workflow env context.
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" D8_JAR="$BT/lib/d8.jar"
          AAPT2="$BT/aapt2" ZIPALIGN="$BT/zipalign" APKSIGNER="$BT/apksigner" \
          KEYSTORE="$RUNNER_TEMP/ci.keystore" tools/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: trough-apk, path: out/trough.apk }

  semantic-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publication kernel oracle and memory checks
        run: |
          CORE_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tests/core_world.sh
          CORE_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tests/core_lifecycle.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
          CORE_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tests/core_store.sh
          CORE_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tests/core_documents.sh
          CORE_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tests/core_streams.sh
          CORE_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tests/core_tasks.sh
          CORE_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tests/core_workspace.sh
          CORE_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tests/core_processes.sh

  bench-arm64:
    # Free arm64 runner (public repo): the same static bench, run natively on Neoverse.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: gcc -O2 -static -o bench native/bench/bench.c && ./bench | tee bench-arm64.json
      - name: Semantic publication kernel oracle
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
          tests/core_world.sh && tests/core_lifecycle.sh && tests/core_store.sh
          tests/core_documents.sh
          tests/core_streams.sh
          tests/core_tasks.sh
          tests/core_workspace.sh
          tests/core_processes.sh
      - name: Namespace capability probe oracle
        run: python3 tests/namespaces.py
      - uses: actions/upload-artifact@v4
        with: { name: bench-arm64, path: bench-arm64.json }

  loader-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ELF page-tail differential oracle
        run: python3 tests/loader_pages.py
      - name: texec oracle (Android's app seccomp filter + /data/data/t.t, simulated)
        run: tests/run.sh
      - name: Diagnose a loader failure
        if: failure()
        run: |
          objdump -d /data/data/t.t/x > loader-disassembly.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          readelf -lW /data/data/t.t/l/ld-linux-aarch64.so.1 /data/data/t.t/bin/threadtest
          gdb -batch -ex 'set pagination off' -ex run -ex 'info registers' -ex 'info proc mappings' -ex 'x/16i $pc-32' -ex bt --args /data/data/t.t/bin/threadtest
          cp /data/data/t.t/l/ld-linux-aarch64.so.1 loader-ld.so
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: loader-diagnostics
          path: |
            loader-disassembly.txt
            loader-ld.so
          retention-days: 3
