name: Semantic constrained Qwen model-only probe
on:
  push:
    branches: [research/semantic-constrained-qwen-20261108]
permissions:
  contents: read
concurrency:
  group: semantic-constrained-qwen-one-shot
  cancel-in-progress: false
jobs:
  frozen-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research/semantic-constrained-qwen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU-only dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 lm-format-enforcer==0.11.3 jsonschema==4.23.0
      - name: Frozen paired generation and exact execution
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
          OMP_NUM_THREADS: '2'
        run: timeout 600 python research/semantic-constrained-qwen/constrained.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-constrained-qwen-results
          path: research/semantic-constrained-qwen/*results.json
          retention-days: 7
